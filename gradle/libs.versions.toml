[versions]
agp = "8.6.1"
kotlin = "1.9.24"
ksp = "1.9.24-1.0.20"
composeCompiler = "1.5.14"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
room = "2.6.1"
hilt = "2.50"
hiltNavigationCompose = "1.2.0"
retrofit = "2.9.0"
gson = "2.10.1"
coroutines = "1.9.0"
camerax = "1.4.1"
tensorflowLite = "2.14.0"
